[package]
name = "ble-gatt-iroh"
description = "iroh custom transport that carries QUIC over ble-gatt's GATT datagram channel."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ble-gatt = { path = "../ble-gatt" }
# `unstable-custom-transports` is iroh's own label: the trait this crate
# implements may change in a minor iroh release, so iroh and the crates
# whose types appear in that trait are pinned to the release tested here.
iroh = { version = "=1.3.0", default-features = false, features = ["unstable-custom-transports", "tls-ring"] }
iroh-base = "=1.3.0"
log.workspace = true
n0-future = "0.3"
n0-watcher = "1"
# Part of `CustomEndpoint::poll_recv`'s signature, so it must resolve to the
# version iroh itself uses.
noq-udp = { version = "=1.3.0", default-features = false }
tokio.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util"] }
tokio-stream.workspace = true
uuid.workspace = true
