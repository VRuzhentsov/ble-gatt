[workspace]
resolver = "2"
members = ["ble-gatt", "ble-gatt-iroh", "tauri-plugin-ble-gatt", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/VRuzhentsov/ble-gatt"

[workspace.dependencies]
async-trait = "0.1"
log = "0.4"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

# Each crate takes these with `[lints] workspace = true`. The pre-commit hook
# (`cargo xtask pre-commit`) stops a commit on clippy warnings on its lines.
[workspace.lints.clippy]
all = "warn"
