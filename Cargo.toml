[workspace]
resolver = "2"
members = ["ble-gatt", "ble-gatt-iroh", "tauri-plugin-ble-gatt"]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/VRuzhentsov/ble-gatt"
# Released as git tags only (release-plz.toml); never uploaded to crates.io.
publish = false

[workspace.dependencies]
async-trait = "0.1"
log = "0.4"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

# Each crate takes these with `[lints] workspace = true`. CI and the
# pre-commit hook run clippy with `-D warnings`.
[workspace.lints.clippy]
all = "warn"
too_many_lines = "warn"
# Restriction lints: no debug or placeholder code, no direct console output
# from library code, a written safety reason for each `unsafe` block, and a
# reason for each `allow`.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
# Selected pedantic and nursery lints with few false positives.
bool_to_int_with_if = "warn"
cast_lossless = "warn"
cloned_instead_of_copied = "warn"
equatable_if_let = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
inconsistent_struct_constructor = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
needless_continue = "warn"
needless_raw_string_hashes = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
ref_option_ref = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
