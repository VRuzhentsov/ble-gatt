[package]
name = "ble-gatt"
description = "Async, transport-agnostic BLE GATT central+peripheral primitives — no Tauri dependency."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
log.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd"] }
futures = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# So `hw_peer` can actually show the library's `log` output. Without a
# logger installed the facade discards every record, and the hardware
# harness would prove nothing about the instrumentation it is meant to
# exercise.
env_logger = "0.11"
