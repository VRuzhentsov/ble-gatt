[package]
name = "ble-gatt"
description = "Async, transport-agnostic BLE GATT central+peripheral primitives — no Tauri dependency."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
log.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
uuid.workspace = true
# Optional, only compiled in behind `mock-broker` — see docs/adr/0004.
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd"] }
# Same versions `bluer` already depends on (no new crates): discovery runs on
# a D-Bus connection of our own, because `bluer` neither exposes
# `StopDiscovery` nor reports its result. See `DiscoveryBus` in
# `backend/linux.rs`.
dbus = "0.9"
dbus-tokio = "0.7"
futures = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# So `hw_peer` can actually show the library's `log` output. Without a
# logger installed the facade discards every record, and the hardware
# harness would prove nothing about the instrumentation it is meant to
# exercise.
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# A fake `org.bluez` adapter for the discovery tests in `backend/linux.rs`.
# Same version `bluer` already depends on.
dbus-crossroads = "0.5"

[features]
# Lets `backend::mock::MockNetwork` run as a broker process that separate OS
# processes connect to over a socket, instead of sharing an `Arc` in one
# process — see docs/adr/0004-mock-broker-for-cross-process-e2e.md. Off by
# default: zero new deps/behavior change for existing consumers.
mock-broker = ["dep:serde", "dep:serde_json", "uuid/serde", "tokio/net", "tokio/io-util"]

[[test]]
name = "mock_broker"
required-features = ["mock-broker"]
