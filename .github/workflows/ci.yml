name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by release-button.yml before it tags a release.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # bluer (the Linux driver) links against libdbus at build time.
      # bluer links against libdbus; Tauri (the plugin) against WebKitGTK.
      - name: Install system libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y libdbus-1-dev
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: cargo fmt
        run: cargo fmt --all --check
      # Each tracked source file has at most 2,500 lines (docs/code-style.md).
      - name: File length
        run: >-
          git ls-files -z '*.rs' '*.kt' ':!:**/gen/**' ':!:**/vendor/**'
          | xargs -0 wc -l
          | awk '$2 != "total" && $1 > 2500 { print "over 2500 lines:", $2; failed = 1 } END { exit failed }'
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test -p ble-gatt
      - name: cargo test (Tauri plugin, includes the JNI name check)
        run: cargo test -p tauri-plugin-ble-gatt
      # The Android driver and the plugin's Android code compile only for
      # Android; check them without an NDK (no linking).
      - name: cargo check (Android)
        run: |
          rustup target add aarch64-linux-android
          cargo check --target aarch64-linux-android -p tauri-plugin-ble-gatt
      - name: cargo test (ble-gatt-iroh)
        run: cargo test -p ble-gatt-iroh

  # The Windows driver compiles only for Windows, so the Linux job never
  # builds, lints or tests it. `cargo fmt` stays in the Linux job: rustfmt
  # formats every module regardless of `cfg`. Tests that need a real radio
  # are `#[ignore]`d and stay excluded.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy -p ble-gatt --all-targets -- -D warnings
      - name: cargo test
        run: cargo test -p ble-gatt
