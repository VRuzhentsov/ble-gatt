name: Release-plz

# Configured by release-plz.toml. Follows https://release-plz.dev/docs/github/quickstart
# without crates.io: no CARGO_REGISTRY_TOKEN, git tags and GitHub releases only.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Tags `v{version}` and publishes a GitHub release when the version in
  # Cargo.toml is not tagged yet. No concurrency group: a cancelled pending
  # run could skip a release (see the quickstart).
  release:
    name: Release-plz release
    if: ${{ github.repository_owner == 'VRuzhentsov' }}
    runs-on: ubuntu-latest
    permissions:
      # Create the tag and the release.
      contents: write
      # Find the pull request a commit was merged from.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Opens or updates the release pull request. Runs after `release`, so on the
  # commit that was just tagged it sees the new tag and proposes nothing.
  release-pr:
    name: Release-plz PR
    if: ${{ github.repository_owner == 'VRuzhentsov' }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      # Push the release branch.
      contents: write
      # Create and update the release pull request.
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # cargo-semver-checks builds the crates' docs: bluer links against
      # libdbus, Tauri against WebKitGTK (same list as ci.yml).
      - name: Install system libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y libdbus-1-dev
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Run release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
