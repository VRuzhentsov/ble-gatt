[package]
name = "tauri-plugin-ble-gatt"
description = "Tauri plugin wrapper around the ble-gatt crate: BLE GATT central+peripheral as Tauri commands/events."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
links = "tauri-plugin-ble-gatt"

[dependencies]
ble-gatt = { path = "../ble-gatt", version = "0.1.0" }
async-trait.workspace = true
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
tao = "0.35"
ndk-context = "0.1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
